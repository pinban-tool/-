<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼板助手 · 标准版｜整合测试 v1</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#243044;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:22px 14px}h1{font-size:25px;margin:0 0 6px}.muted{color:#697589;font-size:13px}.panel{background:white;border:1px solid #e5eaf2;border-radius:17px;padding:18px;margin-top:14px;box-shadow:0 3px 16px #26375b08}.tabs{display:flex;gap:8px;margin-top:18px}.tabs button{flex:1}.tabs .active{background:#365ad9;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;color:#526079;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #d9e0eb;border-radius:9px;background:white;font-size:15px;color:#1f2c40}button{border:0;border-radius:10px;padding:11px 15px;background:#e9edfa;color:#30467e;font-weight:650;cursor:pointer}.primary{background:#365ad9;color:white;width:100%;margin-top:14px;font-size:16px}.danger{color:#ad3745;background:#fff0f0}.item{padding:12px;background:#f7f9fd;border-radius:12px;margin:10px 0}.itemhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e9edf3;padding:9px 5px}svg{max-width:100%;height:auto;border:1px solid #e4e8ef;border-radius:9px;background:#fff}.result{line-height:1.8}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f3f6ff;border-radius:10px;padding:12px}.metric strong{display:block;font-size:22px;color:#365ad9}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.note{font-size:12px;color:#6a7486}.scroll{max-height:340px;overflow:auto}@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:13px}h1{font-size:22px}}</style></head><body><main class="wrap"><h1>拼板助手 · 标准版</h1><div class="muted">整合测试版 v1 · 2026-10-16 · 基于原 PRO 合并版</div><div class="muted">单尺寸 / 混合尺寸 · 全部单位 cm · 保持输入方向，不自动旋转</div><div class="tabs"><button id="tabSingle" class="active" onclick="mode('single')">单尺寸拼版</button><button id="tabMixed" onclick="mode('mixed')">混合尺寸拼版</button></div><section class="panel"><h3>画板与排版参数</h3><div class="grid"><div><label>画板宽度 (cm)</label><input id="bw" type="number" value="15" step="any"></div><div><label>画板高度 (cm)</label><input id="bh" type="number" value="15" step="any"></div><div><label>右侧最少留白 (cm)</label><input id="margin" type="number" value="0.2" step="any"></div><div><label>横向间距 (cm)</label><input id="gx" type="number" value="0" step="any"></div><div><label>纵向间距 (cm)</label><input id="gy" type="number" value="0" step="any"></div><div id="tolbox"><label>数量容差 (个)</label><input id="tol" type="number" value="10" step="1"></div></div><p class="note">横向必须预留余量；纵向不超画板。间距指相邻图案之间的净间隔。</p></section><section class="panel" id="single"><h3>单尺寸图案</h3><div class="grid"><div><label>图案宽度 (cm)</label><input id="sw" type="number" value="3.48" step="any"></div><div><label>图案高度 (cm)</label><input id="sh" type="number" value="1.58" step="any"></div><div><label>目标数量 (个)</label><input id="sq" type="number" value="842"></div></div><button class="primary" onclick="calculateSingle()">计算单尺寸拼版</button></section><section class="panel hidden" id="mixed"><h3>不同尺寸图案</h3><div class="muted">同一画板混排，每种图案分别输入尺寸和需求数量。</div><div id="items"></div><button onclick="addItem()">＋ 添加一种尺寸</button><button class="primary" onclick="calculateMixed()">计算混合尺寸拼版</button></section><section class="panel hidden" id="out"><h3>计算结果</h3><div id="summary" class="result"></div><div id="drawing"></div><div class="actions"><button onclick="copyResult()">复制计算结果</button><button onclick="exportSVG()">导出排版示意 SVG</button></div><p class="note">示意图仅供核对排布；实际生产仍需检查出血、裁切、安全边距及设备公差。混合模式使用整行启发式估算，不保证最优版数，也不保证各版一致。</p></section></main><script>let current='single',counter=0,lastText='',lastSvg='';const $=id=>document.getElementById(id),num=id=>Number($(id).value),fmt=x=>Number(x.toFixed(3));function mode(m){current=m;$('single').classList.toggle('hidden',m!=='single');$('mixed').classList.toggle('hidden',m!=='mixed');$('tolbox').classList.toggle('hidden',m!=='single');$('tabSingle').classList.toggle('active',m==='single');$('tabMixed').classList.toggle('active',m==='mixed');$('out').classList.add('hidden')}function addItem(w='',h='',q=''){if(counter>=20)return;counter++;const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="itemhead"><strong>图案 <span class="itemnum"></span></strong><button class="danger" onclick="this.closest('.item').remove();renumber()">删除</button></div><div class="grid"><div><label>宽度 (cm)</label><input class="iw" type="number" step="any" value="${w}"></div><div><label>高度 (cm)</label><input class="ih" type="number" step="any" value="${h}"></div><div><label>需求数量</label><input class="iq" type="number" step="1" value="${q}"></div></div>`;$('items').appendChild(el);renumber()}function renumber(){document.querySelectorAll('.itemnum').forEach((e,i)=>e.textContent=i+1)}addItem('3.48','1.58','100');addItem('2.5','2','80');function params(){let W=num('bw'),H=num('bh'),m=num('margin'),gx=num('gx'),gy=num('gy');if(![W,H,m,gx,gy].every(Number.isFinite)||W<=0||H<=0||m<=0||m>=W||gx<0||gy<0)throw Error('请检查画板、间距和横向预留余量，余量必须大于 0。');return{W,H,m,gx,gy,avail:W-m}}function makeSvg(p,rows){let scale=Math.min(4,540/Math.max(p.W,p.H)),w=p.W*scale,h=p.H*scale;let colors=['#7295ee','#efa97b','#8cc8ac','#c1a1e9','#f2d276','#86c6df'];let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="white"/><rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="#283c5d" stroke-width="1.5"/>`;for(let row of rows){for(let j=0;j<row.n;j++){let x=(row.x+j*(row.w+p.gx))*scale,y=row.y*scale;s+=`<rect x="${x}" y="${y}" width="${row.w*scale}" height="${row.h*scale}" fill="${colors[row.i%colors.length]}" stroke="#334b70" stroke-width=".65"/><text x="${x+row.w*scale/2}" y="${y+row.h*scale/2+3}" text-anchor="middle" font-size="${Math.min(11,row.w*scale/3)}" fill="#213047">${row.i+1}</text>`}}s+='</svg>';return s}function render(text,svg){lastText=text;lastSvg=svg;$('summary').innerHTML=text.replaceAll('\n','<br>');$('drawing').innerHTML='<h4>单版排布示意</h4>'+svg;$('out').classList.remove('hidden');$('out').scrollIntoView({behavior:'smooth',block:'start'})}function calculateSingle(){try{const p=params(),w=num('sw'),h=num('sh'),q=num('sq'),tol=num('tol');if(!(w>0&&h>0&&Number.isInteger(q)&&q>0&&Number.isInteger(tol)&&tol>=0))throw Error('请填写有效图案尺寸、整数目标数量和容差。');let maxC=Math.floor((p.avail+p.gx+1e-8)/(w+p.gx)),maxR=Math.floor((p.H+p.gy+1e-8)/(h+p.gy));if(maxC<1||maxR<1)throw Error('图案无法放入画板，请调整尺寸。');let options=[];for(let c=1;c<=Math.min(maxC,2000);c++)for(let r=1;r<=Math.min(maxR,2000);r++){let n=c*r,base=q/n;for(let sheets of new Set([Math.max(1,Math.floor(base)),Math.max(1,Math.ceil(base))])){let total=n*sheets,diff=Math.abs(total-q),usedW=c*w+(c-1)*p.gx,usedH=r*h+(r-1)*p.gy;options.push({c,r,n,sheets,total,diff,usedW,usedH,coverage:usedW/p.W,area:usedW*usedH})}}options.sort((a,b)=>(a.diff<=tol?0:1)-(b.diff<=tol?0:1)||b.coverage-a.coverage||a.diff-b.diff||b.area-a.area||a.sheets-b.sheets);let best=options[0],x=(p.W-best.usedW)/2,y=(p.H-best.usedH)/2;let rows=Array.from({length:best.r},(_,i)=>({i:0,n:best.c,x,y:y+i*(h+p.gy),w,h}));let text=`推荐：${best.c} 列 × ${best.r} 行 × ${best.sheets} 版\n每版 ${best.n} 个；总数 ${best.total} 个；与目标相差 ${best.total-q>0?'+':''}${best.total-q} 个\n每版排布尺寸 ${fmt(best.usedW)} × ${fmt(best.usedH)} cm\n画板 ${p.W} × ${p.H} cm；左右各留 ${fmt((p.W-best.usedW)/2)} cm；上下各留 ${fmt((p.H-best.usedH)/2)} cm\n所有版行列、方向和间距一致。`;let alts=options.filter(o=>o.c!==best.c||o.r!==best.r||o.sheets!==best.sheets).slice(0,3);if(alts.length)text+='\n其他方案：'+alts.map(o=>`${o.c}列×${o.r}行×${o.sheets}版=${o.total}个`).join('；');render(text,makeSvg(p,rows))}catch(e){alert(e.message)}}function calculateMixed(){try{const p=params();let a=[...document.querySelectorAll('#items .item')].map((e,i)=>({i,w:Number(e.querySelector('.iw').value),h:Number(e.querySelector('.ih').value),q:Number(e.querySelector('.iq').value)}));if(!a.length||a.some(x=>!(x.w>0&&x.h>0&&Number.isInteger(x.q)&&x.q>0)))throw Error('请填写所有图案的有效尺寸和整数数量。');if(a.some(x=>x.w>p.avail||x.h>p.H))throw Error('有图案尺寸超过可用画板，请检查。');let rem=a.map(x=>x.q),boards=[];for(let k=0;k<1000&&rem.some(x=>x>0);k++){let y=0,rows=[],counts=a.map(()=>0);while(y<p.H-1e-8){let candidates=a.map((v,i)=>{let n=Math.min(rem[i],Math.floor((p.avail+p.gx+1e-8)/(v.w+p.gx)));return n>0&&v.h<=p.H-y+1e-8?{i,n,score:n*v.w*v.h,used:n*v.w+(n-1)*p.gx}:null}).filter(Boolean).sort((x,y)=>y.score-x.score||y.used-x.used);if(!candidates.length)break;let c=candidates[0],v=a[c.i],x=(p.W-c.used)/2;rows.push({i:c.i,n:c.n,x,y,w:v.w,h:v.h});counts[c.i]+=c.n;rem[c.i]-=c.n;y+=v.h+p.gy}if(!rows.length)break;boards.push({rows,counts})}let done=a.map((v,i)=>v.q-rem[i]);let text=`预计需要 ${boards.length} 版；共排 ${done.reduce((s,n)=>s+n,0)} 个\n`+a.map((v,i)=>`图案${i+1}（${v.w} × ${v.h} cm）：需求 ${v.q} 个，已排 ${done[i]} 个，剩余 ${rem[i]} 个`).join('\n')+'\n'+boards.map((b,i)=>`第 ${i+1} 版：`+b.rows.map(r=>`图案${r.i+1} × ${r.n}`).join('；')).join('\n');if(rem.some(n=>n))text+='\n注意：最多展示 1000 版，仍有未排数量。';render(text,makeSvg(p,boards[0]?.rows||[]))}catch(e){alert(e.message)}}function copyResult(){navigator.clipboard?.writeText(lastText).then(()=>alert('已复制'),()=>alert('复制失败，请手动选择文字'))}function exportSVG(){if(!lastSvg)return;let b=new Blob([lastSvg],{type:'image/svg+xml'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='拼版示意.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}</script></body></html>
