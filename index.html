<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>拼版计算器</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="拼版计算器"><meta name="theme-color" content="#f5f7fb"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:#182638;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:35px auto;padding:0 22px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:30px;letter-spacing:-.8px;margin:0 0 7px}header p,.muted{color:#748195;margin:0}.tag{border:1px solid #dce5f2;border-radius:30px;background:white;padding:8px 13px;font-size:12px;color:#57728d}.layout{display:grid;grid-template-columns:355px 1fr;gap:20px}.panel{background:white;border:1px solid #e7edf5;border-radius:19px;padding:24px;box-shadow:0 6px 24px #1b3c6410}.panel h2{font-size:17px;margin:0 0 21px}.field{margin:0 0 16px}label{display:block;font-size:13px;font-weight:650;color:#44536a;margin-bottom:8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;padding:12px 13px;border:1px solid #dce4ee;border-radius:10px;background:#fcfdff;font:inherit;font-size:15px;color:#15283e;outline:none}input:focus,select:focus{border-color:#5e87d9;box-shadow:0 0 0 3px #5e87d920}.hint{font-size:12px;color:#7c889a;line-height:1.7;margin:6px 0 0}.btn{border:0;border-radius:11px;background:#326ad6;color:white;padding:12px 15px;font-weight:650;font-size:14px;cursor:pointer}.btn.secondary{background:#eef3fa;color:#315274}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions .btn{flex:1}.rule{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:13px;color:#4a5a70}.rule input{width:16px;height:16px;accent-color:#326ad6}.result-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.headline{font-size:25px;font-weight:750;letter-spacing:-.6px}.status{font-size:12px;border-radius:30px;padding:6px 10px;background:#e7f7ee;color:#197246;white-space:nowrap}.status.warn{background:#fff3df;color:#98631a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:19px 0}.stat{background:#f4f7fc;border-radius:12px;padding:14px 10px}.stat strong{font-size:21px;display:block}.stat span{font-size:11px;color:#78869a}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px}.details div{border-bottom:1px solid #edf1f6;padding:9px 0;display:flex;justify-content:space-between;gap:10px}.details span{color:#77859a}.details b{text-align:right}.preview{background:#f8faff;border:1px solid #e7edf5;border-radius:14px;padding:17px;margin-top:17px}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:650}.preview svg{display:block;width:100%;max-height:370px}.foot{font-size:12px;line-height:1.75;color:#77859a;margin-top:13px}.error{color:#b83939;font-size:13px;margin-top:12px}.alt{margin-top:20px;padding-top:16px;border-top:1px solid #e7edf5}.alt h3{font-size:14px;margin:0 0 9px}.alt button{width:100%;background:#f5f8fc;border:1px solid #e4eaf3;text-align:left;padding:10px;border-radius:9px;margin:5px 0;cursor:pointer;color:#304258;font-size:12px}.alt button:hover{border-color:#9eb7e5}.tiny{font-size:11px;color:#8490a1}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.wrap{margin:12px auto}header{align-items:start;gap:8px;flex-wrap:wrap}.panel{padding:17px}.wrap{padding:0 12px}input,select{font-size:16px}.headline{font-size:21px}.stats{gap:7px}.stat{padding:10px 7px}.stat strong{font-size:18px}.details{grid-template-columns:1fr 1fr;gap:7px}.preview{padding:9px}.tag{font-size:10px}h1{font-size:25px}}@media print{body{background:white}.wrap{margin:0;max-width:none}.panel{box-shadow:none}.actions,.alt,.tag{display:none}.layout{grid-template-columns:290px 1fr}}
</style></head><body><div class="wrap"><header><div><h1>▦ 拼版计算器</h1><p>你的专属拼版助手 · iPhone 离线版</p></div><div class="tag">● 无需联网 · 数据不上传</div></header><main class="layout"><section class="panel"><h2>输入拼版参数</h2><div class="pair"><div class="field"><label for="itemW">单个宽度 · mm</label><input id="itemW" type="number" min="0.001" step="any" value="10.3"></div><div class="field"><label for="itemH">单个高度 · mm</label><input id="itemH" type="number" min="0.001" step="any" value="14.3"></div></div><div class="field"><label for="qty">目标总数量 · 个</label><input id="qty" type="number" min="1" step="1" value="204"></div><div class="pair"><div class="field"><label for="boardW">画板宽度 · mm</label><input id="boardW" type="number" min="0.001" step="any" value="103"></div><div class="field"><label for="boardH">画板高度 · mm</label><input id="boardH" type="number" min="0.001" step="any" value="150"></div></div><div class="field"><label for="direction">排列方向</label><select id="direction"><option value="fixed">保持输入方向（不旋转）</option><option value="portrait">统一竖向（高边朝上）</option><option value="landscape">统一横向（宽边朝上）</option></select></div><div class="field"><label for="margin">横向至少留边 · mm（总余量）</label><input id="margin" type="number" min="0.001" step="any" value="0.5"><p class="hint">防止刚好卡满画板宽度；默认至少剩余 0.5 mm。可按工艺调整。</p></div><div class="field"><label for="gap">图案间距 · mm</label><input id="gap" type="number" min="0" step="any" value="0"><p class="hint">横向、纵向使用相同间距；默认0 mm。</p></div><div class="field"><label for="tolerance">允许数量误差 · 个</label><input id="tolerance" type="number" min="0" step="1" value="10"></div><div class="rule"><input id="identical" type="checkbox" checked disabled><span>所有版的排列完全相同（固定规则）</span></div><div class="actions"><button class="btn" id="calculate">重新计算</button><button class="btn secondary" id="reset">恢复默认</button></div><p class="hint">算法先找数量误差范围内的方案，再优先横向接近画板宽度，并兼顾材料使用；不满足误差时显示最接近的可行方案。</p></section><section class="panel"><div id="result"><h2>计算结果</h2></div><div class="actions" style="margin-top:16px"><button class="btn secondary" id="copy">复制结果</button><button class="btn secondary" id="saveSvg">保存单版 SVG</button><button class="btn secondary" id="print">打印 / 存 PDF</button></div><div id="alternatives" class="alt"></div></section></main><p class="foot">说明：画板和图案均按矩形计算，单位为毫米；图案不会变形。拼版示意按真实比例绘制。横向余量为整版总剩余空间（居中时左右各一半）。实际生产还应考虑出血、刀缝、裁切安全边及设备公差。SVG 导出的是矩形定位示意，不含原始图案。</p></div><script>
'use strict';
const $=id=>document.getElementById(id);let options=[],selected=null,lastSvg='',lastText='';
const fmt=n=>Number(n.toFixed(3)).toString();
function vals(){let ids=['itemW','itemH','qty','boardW','boardH','margin','gap','tolerance'];let v={};for(let id of ids)v[id]=Number($(id).value);v.direction=$('direction').value;return v;}
function compute(){let v=vals();let bad=['itemW','itemH','boardW','boardH'].some(k=>!Number.isFinite(v[k])||v[k]<=0)||!Number.isInteger(v.qty)||v.qty<1||!Number.isInteger(v.tolerance)||v.tolerance<0||v.margin<=0||v.gap<0||!Number.isFinite(v.margin)||!Number.isFinite(v.gap);if(bad){$('result').innerHTML='<p class="error">请输入有效的正尺寸、整数数量和非负间距。横向必须保留大于0的余量。</p>';$('alternatives').innerHTML='';options=[];return}
let w=v.itemW,h=v.itemH;if(v.direction==='portrait'&&w>h||v.direction==='landscape'&&h>w)[w,h]=[h,w];
let maxC=Math.floor((v.boardW-v.margin+v.gap-1e-9)/(w+v.gap));let maxR=Math.floor((v.boardH+v.gap+1e-9)/(h+v.gap));if(maxC<1||maxR<1){$('result').innerHTML='<p class="error">当前尺寸和留边要求下，画板放不下一个图案。请调整参数。</p>';$('alternatives').innerHTML='';options=[];return}
let all=[];for(let c=1;c<=maxC;c++)for(let r=1;r<=maxR;r++){let per=c*r,pw=c*w+(c-1)*v.gap,ph=r*h+(r-1)*v.gap;let guess=v.qty/per;let ns=new Set([1,Math.max(1,Math.floor(guess)),Math.max(1,Math.ceil(guess)),Math.max(1,Math.round(guess))]);for(let n of ns){let total=n*per,diff=total-v.qty,err=Math.abs(diff);all.push({c,r,n,per,pw,ph,total,diff,err,w,h,v,slack:v.boardW-pw,area:pw*ph/(v.boardW*v.boardH)});}}
let within=all.filter(a=>a.err<=v.tolerance);let pool=within.length?within:all;
// Quantity is a hard preference when possible; then favor width utilization, followed by fewer boards and count accuracy.
let rank=a=>[a.slack, a.n, a.err, -a.area, -a.r];let cmp=(a,b)=>{let aa=rank(a),bb=rank(b);for(let i=0;i<aa.length;i++)if(aa[i]!==bb[i])return aa[i]-bb[i];return 0};
if(!within.length){let minErr=Math.min(...all.map(a=>a.err));pool=all.filter(a=>a.err===minErr)}
pool.sort(cmp);options=pool.filter((a,i,arr)=>arr.findIndex(b=>b.c===a.c&&b.r===a.r&&b.n===a.n)===i).slice(0,6);render(options[0]);}
function render(a){selected=a;let {v}=a,ok=a.err<=v.tolerance;let stat=(name,num)=>`<div class="stat"><strong>${num}</strong><span>${name}</span></div>`;let d=(name,val)=>`<div><span>${name}</span><b>${val}</b></div>`;let status=ok?'数量符合 ±'+v.tolerance+' 个':'数量超出 ±'+v.tolerance+' 个';let diff=a.diff===0?'刚好':(a.diff>0?'多 '+a.diff:'少 '+(-a.diff))+' 个';let note=ok?'已在数量误差范围内，优先让横向尽量接近画板宽度。':'没有找到符合数量误差的完全相同拼版，已选择数量差距最小的方案。';
let vw=v.boardW,vh=v.boardH;let rects='';for(let i=0;i<a.per;i++){let col=i%a.c,row=Math.floor(i/a.c);let x=(vw-a.pw)/2+col*(a.w+v.gap),y=(vh-a.ph)/2+row*(a.h+v.gap);rects+=`<rect x="${x}" y="${y}" width="${a.w}" height="${a.h}" fill="#9bbde9" fill-opacity=".73" stroke="#2c6ac3" stroke-width="${Math.max(.12,Math.min(.5,Math.min(a.w,a.h)/30))}"/>`}
lastSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vw} ${vh}" width="${vw}mm" height="${vh}mm"><rect width="${vw}" height="${vh}" fill="white"/><rect x="0" y="0" width="${vw}" height="${vh}" fill="none" stroke="#6b7f99" stroke-width=".4"/>${rects}</svg>`;
lastText=`拼版计算结果\n单个尺寸：${fmt(a.w)} × ${fmt(a.h)} mm\n画板尺寸：${fmt(vw)} × ${fmt(vh)} mm\n排列：${a.c}列 × ${a.r}行\n每版：${a.per}个\n版数：${a.n}版（完全相同）\n总数量：${a.total}个（目标${v.qty}，${diff}）\n实际尺寸：${fmt(a.pw)} × ${fmt(a.ph)} mm\n横向余量：${fmt(vw-a.pw)} mm\n纵向余量：${fmt(vh-a.ph)} mm\n图案间距：${fmt(v.gap)} mm\nAI水平步进：${fmt(a.w+v.gap)} mm，垂直步进：${fmt(a.h+v.gap)} mm`;
$('result').innerHTML=`<div class="result-top"><div><h2 style="margin-bottom:7px">推荐拼版</h2><div class="headline">${a.c}列 × ${a.r}行 × ${a.n}版</div></div><div class="status ${ok?'':'warn'}">${status}</div></div><div class="stats">${stat('每版数量',a.per+' 个')}${stat('总数量',a.total+' 个')}${stat('与目标相比',diff)}${stat('相同版数',a.n+' 版')}</div><div class="details">${d('实际拼版宽度',fmt(a.pw)+' mm')}${d('实际拼版高度',fmt(a.ph)+' mm')}${d('横向总余量',fmt(vw-a.pw)+' mm')}${d('纵向总余量',fmt(vh-a.ph)+' mm')}${d('水平复制步进',fmt(a.w+v.gap)+' mm')}${d('垂直复制步进',fmt(a.h+v.gap)+' mm')}</div><div class="preview"><div class="preview-head"><span>单版示意 · ${a.per}个</span><span class="tiny">${fmt(vw)} × ${fmt(vh)} mm</span></div>${lastSvg.replace('width="'+vw+'mm" height="'+vh+'mm"','width="100%" height="350" preserveAspectRatio="xMidYMid meet"')}</div><p class="hint">${note} 全部${a.n}版使用相同排列。示意图中图案居中放置。</p>`;
$('alternatives').innerHTML=options.length>1?'<h3>其他可选拼法</h3>'+options.filter(b=>b!==a).map(b=>`<button type="button" data-index="${options.indexOf(b)}">${b.c}列 × ${b.r}行 × ${b.n}版 · 总计${b.total}个（${b.diff>0?'+':''}${b.diff}） · ${fmt(b.pw)} × ${fmt(b.ph)} mm</button>`).join(''):'';
$('alternatives').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(options[Number(b.dataset.index)])));
}
function download(content,name,type){let blob=new Blob([content],{type});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
$('calculate').onclick=compute;$('reset').onclick=()=>{let d={itemW:'10.3',itemH:'14.3',qty:'204',boardW:'103',boardH:'150',margin:'.5',gap:'0',tolerance:'10',direction:'fixed'};for(let k in d)$(k).value=d[k];compute()};$('copy').onclick=async()=>{if(!selected)return;try{await navigator.clipboard.writeText(lastText);$('copy').textContent='已复制 ✓';setTimeout(()=>$('copy').textContent='复制结果',1500)}catch(e){let t=document.createElement('textarea');t.value=lastText;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('结果已复制')}};$('saveSvg').onclick=()=>{if(selected)download(lastSvg,`拼版_${selected.c}列${selected.r}行_${selected.n}版.svg`,'image/svg+xml;charset=utf-8')};$('print').onclick=()=>window.print();['itemW','itemH','qty','boardW','boardH','direction','margin','gap','tolerance'].forEach(k=>$(k).addEventListener('change',compute));compute();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
